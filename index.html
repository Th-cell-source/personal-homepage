<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>田昊 · 个人主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: linear-gradient(160deg, #f0f4ff 0%, #ffffff 60%); color: #1f2329; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #fff; border-radius: 20px; box-shadow: 0 16px 48px rgba(31,35,41,.1); padding: 48px 40px; max-width: 640px; width: 100%; text-align: center; }
  .avatar { width: 110px; height: 110px; border-radius: 50%; background: linear-gradient(135deg, #4a90d9, #6366f1); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 40px; font-weight: 700; }
  h1 { font-size: 28px; margin-bottom: 6px; }
  .sub { color: #6a7079; font-size: 15px; margin-bottom: 28px; }
  .info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; margin-bottom: 28px; }
  .info div { background: #f7f8fa; border-radius: 10px; padding: 12px 16px; font-size: 14px; }
  .info b { display: block; color: #9aa0a8; font-size: 12px; font-weight: 400; margin-bottom: 2px; }
  .bio { color: #4a4f57; font-size: 14px; line-height: 1.8; text-align: left; background: #fff7f4; border-left: 3px solid #ff4f2e; padding: 14px 18px; border-radius: 0 10px 10px 0; margin-bottom: 28px; }
  .links a { display: inline-block; margin: 0 8px; padding: 9px 20px; border-radius: 20px; text-decoration: none; font-size: 14px; font-weight: 600; }
  .gh { background: #1f2329; color: #fff; }
  .proj { background: #ff4f2e; color: #fff; }
  @media (max-width: 480px) { .info { grid-template-columns: 1fr; } .card { padding: 32px 22px; } }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">田</div>
    <h1>田 昊</h1>
    <div class="sub">大连民族大学 · 物联网工程 · 2023 级</div>
    <div class="info">
      <div><b>学校</b>大连民族大学</div>
      <div><b>专业</b>物联网工程</div>
      <div><b>学号</b>2023250718</div>
      <div><b>方向</b>全栈开发 / 嵌入式</div>
    </div>
    <div class="bio">
      在校学生，平时写 Java、Python、前端，也玩单片机和小项目。正在做软件开发综合实践实训，从大模型微调一路做到 AI 编程工具实战，喜欢把想法做成能跑的小东西。
    </div>
    <div class="links">
      <a class="gh" href="https://github.com/Th-cell-source" target="_blank">GitHub</a>
      <a class="proj" href="https://th-cell-source.github.io/ecom-img-downloader/" target="_blank">我的插件项目</a>
    </div>
  </div>
</body>
</html>
